[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/send-verification-email"
  to = "/.netlify/functions/send-verification-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/smtp-config"
  to = "/.netlify/functions/smtp-config"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/test-email"
  to = "/.netlify/functions/test-email"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
